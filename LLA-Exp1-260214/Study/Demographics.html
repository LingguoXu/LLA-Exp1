{% extends "global/Base.html" %}

{% block progress %}85{% endblock %}
{% block top_bar_meta %}Patient Profile{% endblock %}

{% block extra_css %}
<style>
    .demo-group {
        margin-bottom: var(--space-6);
    }
    .demo-group label {
        display: block; font-weight: 500; font-size: var(--text-sm);
        color: var(--color-text); margin-bottom: var(--space-2);
    }
    .demo-group .form-control {
        max-width: 320px;
    }
    .radio-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .radio-group label {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border: 1.5px solid var(--color-border);
        border-radius: var(--radius-sm);
        cursor: pointer; transition: all 0.2s;
        font-weight: 400; font-size: var(--text-base);
    }
    .radio-group label:hover { border-color: var(--color-primary-light); background: var(--color-primary-ghost); }
    .radio-group input[type="radio"] {
        appearance: none; -webkit-appearance: none;
        width: 18px; height: 18px; border: 2px solid var(--color-border);
        border-radius: 50%; transition: all 0.2s; cursor: pointer;
        flex-shrink: 0;
    }
    .radio-group input[type="radio"]:checked {
        border-color: var(--color-primary); background: var(--color-primary);
        box-shadow: inset 0 0 0 3px white;
    }
    .yn-group { display: flex; gap: var(--space-3); }
    .yn-group label {
        flex: 1; max-width: 150px;
        display: flex; align-items: center; justify-content: center; gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
        cursor: pointer; transition: all 0.2s; font-weight: 400;
    }
    .yn-group label:hover { border-color: var(--color-primary-light); background: var(--color-primary-ghost); }
    .yn-group input[type="radio"] {
        appearance: none; -webkit-appearance: none;
        width: 18px; height: 18px; border: 2px solid var(--color-border);
        border-radius: 50%; transition: all 0.2s; cursor: pointer;
    }
    .yn-group input[type="radio"]:checked {
        border-color: var(--color-primary); background: var(--color-primary);
        box-shadow: inset 0 0 0 3px white;
    }
    .final-actions { margin-top: var(--space-8); display: flex; justify-content: flex-end; }
</style>
{% endblock %}

{% block content %}
<form method="post" id="form">
<div class="card animate-in animate-in-delay-1">

    <div class="animate-in">
        <p class="subtitle">Almost done</p>
        <h2>A Few Questions About You</h2>
    </div>

    <div class="animate-in animate-in-delay-1">
        <p style="font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: var(--space-6);">
            Finally, please answer these brief demographic questions.
        </p>
    </div>

    <!-- Age -->
    <div class="demo-group animate-in animate-in-delay-2">
        <label for="id_age">What is your age?</label>
        <input type="number" name="age" id="id_age" class="form-control"
               min="18" max="100" placeholder="e.g. 35" required>
    </div>

    <!-- Gender -->
    <div class="demo-group animate-in animate-in-delay-3">
        <label>What is your gender?</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="non_binary"> Non-binary / third gender</label>
            <label><input type="radio" name="gender" value="prefer_not"> Prefer not to say</label>
        </div>
    </div>

    <!-- UK Resident -->
    <div class="demo-group animate-in animate-in-delay-4">
        <label>Are you currently a resident of the United Kingdom?</label>
        <div class="yn-group">
            <label><input type="radio" name="uk_resident" value="True" required> Yes</label>
            <label><input type="radio" name="uk_resident" value="False"> No</label>
        </div>
    </div>

    <div class="final-actions">
        <button type="submit" class="btn btn-primary">
            Finish <span class="arrow">&rarr;</span>
        </button>
    </div>
</div>
</form>
{% endblock %}
