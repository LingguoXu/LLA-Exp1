{% load otree %}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{% block page_title %}Research Study{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:         #f5f6fa;
        --surface:    #ffffff;
        --primary:    #4f46e5;
        --primary-h:  #4338ca;
        --primary-l:  #eef2ff;
        --accent:     #ec4899;
        --text:       #1e293b;
        --muted:      #64748b;
        --border:     #e2e8f0;
        --success:    #10b981;
        --error:      #ef4444;
        --radius:     12px;
        --shadow:     0 4px 20px rgba(0,0,0,.06);
        --transition: .28s cubic-bezier(.4,0,.2,1);
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
        min-height: 100vh;
    }

    /* ── Progress ───────────────────────────────────────── */
    .progress-bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        background: var(--surface);
        box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .progress-track { height: 4px; background: var(--border); }
    .progress-fill {
        height: 100%; border-radius: 0 3px 3px 0;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        transition: width .6s ease;
    }
    .progress-text {
        text-align: center; font-size: .68rem; font-weight: 600;
        color: var(--muted); letter-spacing: .06em; padding: 3px 0 5px;
        text-transform: uppercase;
    }

    /* ── Container ──────────────────────────────────────── */
    .container {
        max-width: 700px;
        margin: 0 auto;
        padding: 68px 20px 40px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 36px 32px;
        margin-bottom: 20px;
    }
    @media (max-width: 600px) { .card { padding: 24px 16px; } }

    /* ── Typography ─────────────────────────────────────── */
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .4em; }
    h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: .35em; }
    p  { margin-bottom: .9em; }
    .muted { color: var(--muted); font-size: .92rem; }
    .small { font-size: .82rem; color: var(--muted); }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 11px 28px;
        font-family: inherit; font-size: .92rem; font-weight: 600;
        border: none; border-radius: 10px; cursor: pointer;
        transition: var(--transition); text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-soft { background: var(--primary-l); color: var(--primary); }
    .btn-soft:hover { background: #dde4fc; }

    /* ── Inline blanks ─────────────────────────────────── */
    .blank {
        display: inline-block;
        min-width: 80px;
        padding: 3px 10px;
        font-family: inherit; font-size: inherit;
        border: none;
        border-bottom: 2.5px solid var(--primary);
        background: var(--primary-l);
        border-radius: 4px 4px 0 0;
        color: var(--primary); font-weight: 600;
        text-align: center;
        transition: var(--transition);
        vertical-align: baseline;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .blank:focus {
        outline: none;
        border-bottom-color: var(--accent);
        background: #fdf2f8;
        color: #9d174d;
    }
    .blank.filled {
        background: #ecfdf5;
        border-bottom-color: var(--success);
        color: #065f46;
    }
    .blank::placeholder { color: var(--muted); font-weight: 400; opacity: .6; font-size: .85em; }

    .blank-num {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px;
        font-size: .65rem; font-weight: 700;
        background: var(--primary); color: #fff;
        border-radius: 50%; vertical-align: middle;
        margin-right: 2px;
    }

    /* ── Story paragraph ───────────────────────────────── */
    .story-para {
        font-size: 1rem; line-height: 1.9;
        padding: 14px 16px; margin-bottom: 6px;
        border-radius: 8px;
    }
    .story-para:nth-child(odd) { background: #fafbff; }

    /* ── Progressive reveal ─────────────────────────────── */
    .reveal {
        opacity: 0;
        transform: translateY(14px);
        max-height: 0;
        overflow: hidden;
        transition: opacity .45s ease, transform .45s ease, max-height .5s ease;
        pointer-events: none;
    }
    .reveal.show {
        opacity: 1;
        transform: translateY(0);
        max-height: 2000px;
        overflow: visible;
        pointer-events: auto;
    }

    /* ── Validation ─────────────────────────────────────── */
    .val-msg {
        display: none;
        color: var(--error); font-size: .85rem; font-weight: 500;
        padding: 8px 14px; margin-top: 10px;
        background: #fef2f2; border-radius: 6px;
        border-left: 3px solid var(--error);
    }
    .val-msg.show { display: block; }

    /* ── Divider ────────────────────────────────────────── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Footer row ─────────────────────────────────────── */
    .foot { display: flex; justify-content: flex-end; gap: 10px; padding-top: 16px; }

    /* ── Badge ──────────────────────────────────────────── */
    .badge {
        display: inline-block; padding: 3px 12px;
        font-size: .75rem; font-weight: 700; border-radius: 20px;
        background: var(--primary); color: #fff;
    }

    /* ── Hide oTree chrome ─────────────────────────────── */
    .otree-form-errors, .otree-title { display: none !important; }

    {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    {% if progress %}
    <div class="progress-bar">
        <div class="progress-track">
            <div class="progress-fill" style="width:{{ progress }}%"></div>
        </div>
        <div class="progress-text">{{ progress }}%</div>
    </div>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}

        <form method="post" id="form" style="display:none">
            {% block hidden_fields %}{% endblock %}
            <button type="submit" id="oTreeSubmit"></button>
        </form>
    </div>

    <script>
    /* ── Submit helper ─────────────────────── */
    function submitPage(){ document.getElementById('oTreeSubmit').click(); }

    /* ── Blank live-colour ─────────────────── */
    document.addEventListener('input', function(e){
        if(e.target.classList.contains('blank')){
            e.target.classList.toggle('filled', e.target.value.trim().length > 0);
        }
    });

    {% block scripts %}{% endblock %}
    </script>
</body>
</html>
