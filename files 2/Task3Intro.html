{% extends "global/Base.html" %}
{% load otree %}

{% block content %}
<div class="card" style="text-align:center; padding: 40px 20px;">
    <h1>{{ ui.intro_title }}</h1>

    <div style="font-size:1.05rem; color: #475569; margin-top: 15px; margin-bottom: 24px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.7;">
        {{ ui.intro_text|safe }}
    </div>

    <!-- Payment info callout box -->
    <div style="display:inline-block; text-align:left; background:#f0f9ff; border-left:4px solid #0ea5e9;
                border-radius:6px; padding:16px 22px; margin-bottom:30px; max-width:480px;">
        <div style="font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em;
                    color:#0369a1; margin-bottom:8px;">{{ ui.payment_box_head }}</div>
        <div style="font-size:0.88rem; color:#475569;">{{ ui.payment_box_note|safe }}</div>
    </div>

    <div class="foot" style="justify-content:center;">
        <button type="button" class="btn btn-primary" onclick="submitPage()">
            {{ ui.btn_next }} &rarr;
        </button>
    </div>
</div>
{% endblock %}
